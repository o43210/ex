name: Trace Hyperunit Solana destinations

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Correlate Unit operations, Solana sweeps, and HyperCore ledger
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/trace.py <<'PY'
          import json, time, requests, datetime
          from collections import defaultdict

          SOURCE='7UeT7dffDvptSdnLMcejfMxuDteQ81HsP6b6cBKAVxr6'
          SOL_TREASURY='9SLPTL41SPsYkgdsMzdfJsxymEANKr5bYoBsQzJyKpKS'
          HL_TREASURY='0xA822a9cEB6D6CB5b565bD10098AbCFA9Cf18D748'
          sweeps=[
            ('3CsNA4PaLRgN6HgkZAoCoxeL3pMEY2u3xynEkmmREAGW6FFGvez9y3hdNbvhJeNJQMJvvcgbHvRb1X2Q5stqAa82',1777116789,503.666190534),
            ('4bGVBd3vm3dgYJQXbRjKDis6XarZwhjMfBYz9kb99enzT9C6jmFFuRCxfCRKY7wVqEAjgvkvDjZsMLniomW3XrdF',1777116808,185.526511534),
            ('232WkmEMrVDUFpnbD61nyp1EX8nF67Dy8zb3ZevyYQoXGbdj61xQnh7j9i3mfVV5NWW9wFs7kMcNoUs4CyuVBVpW',1777116824,68.105078493),
            ('29akE2Wvr1cgtyPyqTDQCHSg9S4HjNdvi9pnZobBuPc2Dc5Gh6dH6qYsnhigBsuRUPtyUL5YCoyCMSztEMSkqBrw',1777116838,35.895153534),
            ('2kn7f9Tt7ENV5UMG2yarM1k2XHLBPqGESobsYLnZ4Cxe8t3q7AdEEh24XTghoCDgs6L2ReiYJfTBP4cYqq1EJgPT',1777126388,181.723295814),
            ('2pNqxPQtg9Nmif5W1xH5qFB6gHC4PLBgnYFZzkP4MwSBRhk6m5QasKGMtUkNbmRvMFoKw1XckiYikgtAhJDYnFwX',1777162563,339.316308814),
            ('3zaZ8yTrjYSbtUjFsXUCy97Z1sfRNWVcbWCmqzqgXmY5bJYMbyHTKXt34pN8rT53XgJvPL1sZzM9MxLLzPEBXgmW',1777187158,127.320411764),
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'trace-research/1.0'})
          def getj(url):
            r=s.get(url,timeout=60); r.raise_for_status(); return r.json()
          def postj(url,obj):
            r=s.post(url,json=obj,timeout=60); r.raise_for_status(); return r.json()
          RPCS=['https://api.mainnet-beta.solana.com','https://explorer-api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com']
          def rpc(method,params):
            body={'jsonrpc':'2.0','id':1,'method':method,'params':params}
            last=None
            for ep in RPCS:
              try:
                j=postj(ep,body)
                if j.get('result') is not None: return j['result']
                last=j
              except Exception as e: last=repr(e)
            raise RuntimeError((method,last))
          def tx(sig):
            return rpc('getTransaction',[sig,{'encoding':'jsonParsed','commitment':'confirmed','maxSupportedTransactionVersion':0}])
          def account_keys(t):
            return [x.get('pubkey') if isinstance(x,dict) else x for x in t['transaction']['message']['accountKeys']]
          def parsed_transfers(t):
            out=[]
            ins=list(t['transaction']['message'].get('instructions',[]))
            for g in t.get('meta',{}).get('innerInstructions',[]) or []: ins.extend(g.get('instructions',[]))
            for i in ins:
              p=i.get('parsed') if isinstance(i,dict) else None
              if not isinstance(p,dict) or 'transfer' not in str(p.get('type','')).lower(): continue
              z=p.get('info',{})
              out.append({'program':i.get('program'),'type':p.get('type'),'source':z.get('source'),'destination':z.get('destination'),'lamports':z.get('lamports'),'amount':z.get('amount'),'tokenAmount':z.get('tokenAmount'),'mint':z.get('mint')})
            return out

          result={'source':SOURCE,'solTreasury':SOL_TREASURY,'hlTreasury':HL_TREASURY,'unitOperations':{},'hypercoreLedger':None,'sweepContexts':[],'candidateOperations':{}}
          for a in [SOURCE,SOL_TREASURY,HL_TREASURY]:
            try: result['unitOperations'][a]=getj('https://api.hyperunit.xyz/operations/'+a)
            except Exception as e: result['unitOperations'][a]={'error':repr(e)}

          start=(min(x[1] for x in sweeps)-6*3600)*1000
          end=(max(x[1] for x in sweeps)+6*3600)*1000
          try:
            result['hypercoreLedger']=postj('https://api.hyperliquid.xyz/info',{'type':'userNonFundingLedgerUpdates','user':HL_TREASURY,'startTime':start,'endTime':end})
          except Exception as e: result['hypercoreLedger']={'error':repr(e)}

          cand=set()
          for idx,(sig,bt,amt) in enumerate(sweeps):
            prev=sweeps[idx-1][1] if idx else bt-6*3600
            lower=prev-120
            hist=rpc('getSignaturesForAddress',[SOURCE,{'before':sig,'limit':250}])
            relevant=[h for h in hist if h.get('blockTime') and lower <= h['blockTime'] <= bt]
            # keep at most the newest 100 in the time interval
            relevant=relevant[:100]
            ctx={'sweepSignature':sig,'sweepTime':bt,'sweepAmountSol':amt,'historyCount':len(hist),'relevant':[]}
            for h in relevant:
              try:
                t=tx(h['signature'])
              except Exception as e:
                ctx['relevant'].append({'signature':h['signature'],'blockTime':h.get('blockTime'),'error':repr(e)}); continue
              trs=parsed_transfers(t)
              involved=[z for z in trs if z.get('source')==SOURCE or z.get('destination')==SOURCE]
              if not involved: continue
              row={'signature':h['signature'],'blockTime':h.get('blockTime'),'slot':h.get('slot'),'transfers':involved}
              ctx['relevant'].append(row)
              for z in involved:
                if z.get('destination')==SOURCE and z.get('source'): cand.add(z['source'])
            result['sweepContexts'].append(ctx)

          for a in sorted(cand):
            try: result['candidateOperations'][a]=getj('https://api.hyperunit.xyz/operations/'+a)
            except Exception as e: result['candidateOperations'][a]={'error':repr(e)}

          with open('hyperunit_deep_trace.json','w') as f: json.dump(result,f,indent=2)
          # concise log summary
          print('UNIT_SOURCE_OPS',len(result['unitOperations'].get(SOURCE,{}).get('operations',[])))
          print('UNIT_SOURCE_DESTS',sorted({x.get('destinationAddress') for x in result['unitOperations'].get(SOURCE,{}).get('operations',[]) if x.get('destinationAddress')}))
          print('HL_LEDGER_COUNT',len(result['hypercoreLedger']) if isinstance(result['hypercoreLedger'],list) else result['hypercoreLedger'])
          print('CANDIDATES',len(cand),sorted(cand))
          for c in result['sweepContexts']:
            ins=[]
            for r in c['relevant']:
              for z in r.get('transfers',[]):
                if z.get('destination')==SOURCE: ins.append((r['signature'],r['blockTime'],z.get('source'),z.get('lamports'),z.get('amount')))
            print('SWEEP_CONTEXT',c['sweepSignature'],c['sweepAmountSol'],'INBOUNDS',ins)
          for a,o in result['candidateOperations'].items():
            ops=o.get('operations',[]) if isinstance(o,dict) else []
            if ops: print('CAND_OPS',a,[(x.get('sourceTxHash'),x.get('sourceAmount'),x.get('destinationAddress'),x.get('opCreatedAt'),x.get('state')) for x in ops[:20]])
          PY
          python /tmp/trace.py
      - name: Upload deep trace result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperunit-deep-trace
          path: hyperunit_deep_trace.json
          retention-days: 1
